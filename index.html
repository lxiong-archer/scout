<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout // Automated Design Audits</title>
    <style>
        :root {
            --bg: #09090b;
            --panel: #141416;
            --border: #27272a;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 2rem; }
        h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em; }
        .meta { font-size: 0.875rem; color: var(--text-muted); }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; max-width: 1600px; margin: 0 auto; }
        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .pane { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; overflow: hidden; }
        .pane-title { font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        
        .screenshot-container { display: flex; justify-content: center; align-items: flex-start; background: #000; border-radius: 8px; border: 1px solid var(--border); padding: 1rem; min-height: 400px; }
        .screenshot-container img { max-width: 100%; height: auto; border-radius: 4px; border: 1px solid #333; }

        .doc-content { font-size: 0.95rem; line-height: 1.6; color: #e4e4e7; }
        .doc-content h3 { font-size: 1.15rem; color: var(--text); margin: 1.5rem 0 0.5rem 0; font-weight: 600; }
        .doc-content h3:first-of-type { margin-top: 0; }
        .doc-content ul { padding-left: 1.25rem; margin-bottom: 1rem; }
        .doc-content li { margin-bottom: 0.5rem; }
        .doc-content strong { color: var(--accent); font-weight: 500; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Scout Design System Pipeline</h1>
            <div class="meta">Automated Layout Check • Updated Weekly</div>
        </div>
    </header>

    <main class="dashboard-grid">
        <!-- LEFT: SCREENSHOT VIEWER -->
        <section class="pane">
            <div class="pane-title">Captured Target (Mobile Viewport)</div>
            <div class="screenshot-container">
                <img src="tracked-screens/scout-mobile/latest.png" alt="Latest Mobile Layout" onerror="this.src='https://placehold.co/375x812/27272a/a1a1aa?text=Awaiting+First+Run'">
            </div>
        </section>

        <!-- RIGHT: DESIGN DOCUMENTATION ANALYSIS -->
        <section class="pane">
            <div class="pane-title">Claude Enterprise AI Audit Log</div>
            <div id="audit-log" class="doc-content">
                <h3>📱 Component & Layout Audit</h3>
                <ul>
                    <li><strong>Layout Structure:</strong> Waiting for initial weekly Claude sync log.</li>
                </ul>
            </div>
        </section>
    </main>

</body>
</html>
