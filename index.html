<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCOUT: UI Repository</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:      #FFFFFF;
      --sand:       #E5E0D9;
      --sand-light: #F2EFEB;
      --sand-dark:  #D8D2C9;
      --black:      #000000;
      --gray:       #807A70;
      --gray-light: #B0AAA0;
    }

    html, body {
      background: var(--sand);
      color: var(--black);
      font-family: 'Archivo', 'Inter', sans-serif;
      font-weight: 100;
    }

    /* ── TOP BAR ─────────────────────────────────────────── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--sand-dark);
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    }

    /* Row 1 — title: crisp white */
    .topbar-title-row {
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 24px;
      background: var(--white);
      border-bottom: 1px solid var(--sand);
    }
    .topbar-title-row span {
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* Rows 2 & 3 — filter rows: warm sand tint */
    .filter-row {
      display: flex;
      align-items: stretch;
      background: var(--sand-light);
      min-height: 40px;
    }
    .filter-row + .filter-row {
      border-top: 1px solid var(--sand);
    }

    /* Label — no divider line; just small muted caps with extra spacing */
    .row-label {
      font-weight: 700;
      font-size: 8px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray-light);
      display: flex;
      align-items: center;
      padding: 0 20px 0 24px;
      flex-shrink: 0;
      min-width: 68px;
    }

    /* ── APP TABS ────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      flex-wrap: wrap;
      flex: 1;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 40px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gray);
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s;
    }
    .tab-btn:hover { color: var(--black); }
    .tab-btn.active {
      color: var(--black);
      border-bottom-color: var(--black);
    }

    .lbl-full  { display: inline; }
    .lbl-short { display: none; }
    @media (max-width: 480px) {
      .lbl-full  { display: none; }
      .lbl-short { display: inline; }
      .tab-btn   { padding: 0 10px; font-size: 10px; }
    }

    .tab-count {
      margin-left: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      background: var(--sand);
      color: var(--gray);
      padding: 2px 6px;
      border-radius: 20px;
      transition: background 0.15s, color 0.15s;
    }
    .tab-btn.active .tab-count {
      background: var(--black);
      color: var(--white);
    }

    /* ── FILTER PILLS ────────────────────────────────────── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      flex: 1;
      padding: 7px 8px;
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      background: var(--white);
      border: 1px solid var(--sand-dark);
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .filter-btn:hover {
      border-color: var(--gray);
      color: var(--black);
    }
    .filter-btn.active {
      background: var(--black);
      border-color: var(--black);
      color: var(--white);
    }
    .f-count {
      font-size: 8px;
      opacity: 0.55;
    }
    .filter-btn.active .f-count { opacity: 0.7; }

    /* ── CONTENT AREA ────────────────────────────────────── */
    .content {
      padding: 28px 24px 64px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .app-section { display: none; }
    .app-section.visible { display: block; }

    /* ── DATE GROUP ──────────────────────────────────────── */
    .date-group { margin-bottom: 40px; }
    .date-group.hidden { display: none; }

    .date-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--sand-dark);
    }
    .date-label {
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .date-count {
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gray);
      background: var(--sand-dark);
      padding: 3px 8px;
      border-radius: 20px;
    }
    .date-line { flex: 1; height: 1px; background: var(--sand-dark); }

    /* ── PHOTO GRID ──────────────────────────────────────── */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 12px;
    }
    @media (min-width: 900px) {
      .photo-grid {
        grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
        gap: 14px;
      }
    }

    .photo-card {
      cursor: pointer;
      border-radius: 10px;
      overflow: hidden;
      background: var(--sand-light);
      border: 1px solid var(--sand-dark);
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      aspect-ratio: 9/19.5;
      position: relative;
    }
    .photo-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.13);
    }
    .photo-card.filtered-out { display: none; }

    .photo-card img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      opacity: 0; transition: opacity 0.2s;
    }
    .photo-card img.loaded { opacity: 1; }

    .img-skeleton {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, var(--sand-light) 25%, var(--sand) 50%, var(--sand-light) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .no-results {
      display: none;
      padding: 40px 0;
      text-align: center;
      color: var(--gray-light);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .no-results.visible { display: block; }

    /* ── LIGHTBOX ────────────────────────────────────────── */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.88);
      align-items: center; justify-content: center; padding: 24px;
    }
    .lightbox.open { display: flex; }

    .lightbox-close {
      position: fixed; top: 20px; right: 24px;
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.7); font-size: 28px; font-weight: 100;
      transition: color 0.15s; z-index: 201;
    }
    .lightbox-close:hover { color: #fff; }

    .lightbox-nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8); width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; transition: background 0.15s; z-index: 201;
    }
    .lightbox-nav:hover { background: rgba(255,255,255,0.18); }
    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }

    .lightbox img {
      max-height: calc(100vh - 80px);
      max-width: min(420px, calc(100vw - 120px));
      object-fit: contain; border-radius: 14px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    }
    .lightbox-counter {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      font-weight: 700; font-size: 10px; letter-spacing: 0.15em;
      text-transform: uppercase; color: rgba(255,255,255,0.5);
    }
  </style>
</head>

    const tabBar = document.getElementById('tabBar');
    apps.forEach(app => {
      const count = screenshots.filter(s => s.app === app).length;
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (app === activeApp ? ' active' : '');
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', app === activeApp);
      btn.dataset.app = app;
      btn.innerHTML = `<span class="lbl-full">${app}</span><span class="lbl-short">${SHORT[app]||app.slice(0,7)}</span><span class="tab-count" id="tc-${app}">${count}</span>`;
      btn.addEventListener('click', () => switchApp(app));
      tabBar.appendChild(btn);
    });

    // ── BUILD FILTER PILLS ────────────────────────────────────
    const filterBar = document.getElementById('filterBar');
    FILTERS.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (f.id === 'all' ? ' active' : '');
      btn.dataset.filter = f.id;
      btn.innerHTML = f.label;
      btn.addEventListener('click', () => switchFilter(f.id));
      filterBar.appendChild(btn);
    });

    // ── BUILD CONTENT ─────────────────────────────────────────
    const content = document.getElementById('content');
    apps.forEach(app => {
      const section = document.createElement('div');
      section.className = 'app-section' + (app === activeApp ? ' visible' : '');
      section.id = `app-${app}`;

      const dateMap = {};
      screenshots.filter(s => s.app === app).forEach(s => {
        (dateMap[s.date] = dateMap[s.date]||[]).push(s);
      });

      Object.keys(dateMap).sort().reverse().forEach(date => {
        const items = dateMap[date];
        const group = document.createElement('div');
        group.className = 'date-group';
        group.dataset.date = date;
        group.innerHTML = `
          <div class="date-header">
            <span class="date-label">${formatDate(date)}</span>
            <span class="date-count" id="dc-${app}-${date}">${items.length}</span>
            <div class="date-line"></div>
          </div>`;

        const grid = document.createElement('div');
        grid.className = 'photo-grid';

        items.forEach(s => {
          const idx = lbList.length;
          lbList.push(s);
          const card = document.createElement('div');
          card.className = 'photo-card';
          card.tabIndex = 0;
          card.dataset.idx = idx;
          card.dataset.tags = s.tags.join(' ');

          const skel = document.createElement('div');
          skel.className = 'img-skeleton';

          const img = document.createElement('img');
          img.alt = `${app} screenshot`;
          img.loading = 'lazy';
          img.src = thumbUrl(s.id);
          img.addEventListener('load',  () => { img.classList.add('loaded'); skel.remove(); });
          img.addEventListener('error', () => { skel.style.animation='none'; skel.style.background='var(--sand)'; });

          card.appendChild(skel);
          card.appendChild(img);
          card.addEventListener('click', () => openLightbox(idx));
          card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') openLightbox(idx); });
          grid.appendChild(card);
        });

        const noRes = document.createElement('div');
        noRes.className = 'no-results';
        noRes.id = `nr-${app}-${date}`;
        noRes.textContent = 'No screenshots match this filter';

        group.appendChild(grid);
        group.appendChild(noRes);
        section.appendChild(group);
      });

      content.appendChild(section);
    });

    // ── SWITCH APP ────────────────────────────────────────────
    function switchApp(app) {
      activeApp = app;
      document.querySelectorAll('.tab-btn').forEach(b => {
        const on = b.dataset.app === app;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on);
      });
      document.querySelectorAll('.app-section').forEach(s =>
        s.classList.toggle('visible', s.id === `app-${app}`)
      );
      applyFilter();
    }

    // ── SWITCH FILTER ─────────────────────────────────────────
    function switchFilter(id) {
      activeFilter = id;
      document.querySelectorAll('.filter-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.filter === id)
      );
      applyFilter();
    }

    // ── APPLY FILTER ──────────────────────────────────────────
    function applyFilter() {
      const section = document.getElementById(`app-${activeApp}`);
      if (!section) return;
      section.querySelectorAll('.date-group').forEach(group => {
        const date = group.dataset.date;
        let visible = 0;
        group.querySelectorAll('.photo-card').forEach(card => {
          const tags = card.dataset.tags ? card.dataset.tags.split(' ') : [];
          const show = activeFilter === 'all' || tags.includes(activeFilter);
          card.classList.toggle('filtered-out', !show);
          if (show) visible++;
        });
        const dc = document.getElementById(`dc-${activeApp}-${date}`);
        if (dc) dc.textContent = visible;
        const nr = document.getElementById(`nr-${activeApp}-${date}`);
        if (nr) nr.classList.toggle('visible', visible === 0);
        group.classList.toggle('hidden', visible === 0 && activeFilter !== 'all');
      });
      // update all tab badges
      apps.forEach(app => {
        const appAll = screenshots.filter(s => s.app === app);
        const shown  = activeFilter === 'all' ? appAll.length
          : appAll.filter(s => s.tags.includes(activeFilter)).length;
        const tc = document.getElementById(`tc-${app}`);
        if (tc) tc.textContent = shown;
      });
    }

    // ── LIGHTBOX ──────────────────────────────────────────────
    const lb      = document.getElementById('lightbox');
    const lbImg   = document.getElementById('lbImg');
    const lbClose = document.getElementById('lbClose');
    const lbPrev  = document.getElementById('lbPrev');
    const lbNext  = document.getElementById('lbNext');
    const lbCtr   = document.getElementById('lbCounter');

    function openLightbox(idx) {
      lbIdx = idx; renderLb();
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }
    function renderLb() {
      lbImg.src = fullUrl(lbList[lbIdx].id);
      lbCtr.textContent = `${lbIdx+1} / ${lbList.length}`;
      lbPrev.style.opacity = lbIdx === 0 ? '0.25' : '1';
      lbNext.style.opacity = lbIdx === lbList.length-1 ? '0.25' : '1';
    }

    lbClose.addEventListener('click', closeLightbox);
    lb.addEventListener('click', e => { if(e.target===lb) closeLightbox(); });
    lbPrev.addEventListener('click', () => { if(lbIdx>0) { lbIdx--; renderLb(); } });
    lbNext.addEventListener('click', () => { if(lbIdx<lbList.length-1) { lbIdx++; renderLb(); } });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key==='Escape')      closeLightbox();
      if (e.key==='ArrowLeft'  && lbIdx>0)               { lbIdx--; renderLb(); }
      if (e.key==='ArrowRight' && lbIdx<lbList.length-1) { lbIdx++; renderLb(); }
    });
  </script>
</body>
</html>
