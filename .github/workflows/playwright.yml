name: Deploy Scout Mission

on:
  schedule:
    # ⏰ Trigger automatically every Monday at 8:00 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # 🔘 Keeps a manual "Run Scout Now" button in your GitHub dashboard

jobs:
  scout-run:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Scout Web and Scout Mobile
      run: npx playwright test

    - name: Commit and Push Captured Intelligence
      run: |
        git config --global user.name "Scout Automation Bot"
        git config --global user.email "scout-bot@users.noreply.github.com"
        git add tracked-screens/
        git commit -m "Scout Mission Completed: Auto-captured latest UI flows" || echo "No design changes detected in targets."
        git push